<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일기 누적 현황</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; background-color: #f4f5f7; margin: 0; padding: 15px; color: #333; line-height: 1.5; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .title-area { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        h2 { margin: 0 0 5px 0; font-size: 18px; color: #111; }
        .current-info { font-weight: bold; color: #0056b3; font-size: 14px; margin-bottom: 3px; }
        .sub-info { font-size: 12px; color: #666; }
        .user-card { margin-bottom: 12px; font-size: 14px; }
        .user-header { font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .circles { letter-spacing: 1px; font-size: 13px; }
        .footer { text-align: center; font-size: 12px; color: #888; margin-top: 20px; border-top: 1px dashed #ddd; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title-area">
            <h2>📊 중진회개의기간 전체 누적 현황</h2>
            <div id="current-info" class="current-info">📍 현재 진행: 계산 중...</div>
            <div class="sub-info">*( [1주차:수~일] / [2주차:월~일] / [3주차:월~금] )*</div>
        </div>
        <div id="dashboard"></div>
        <div class="footer">*( 🟢: 완료 / 🔴: 미완료 / ⚪: 예정 )*</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataString = urlParams.get('data');
        
        if (dataString) {
            const data = JSON.parse(decodeURIComponent(dataString));
            const dayIdx = data.d;
            
            let week = dayIdx <= 5 ? 1 : (dayIdx <= 12 ? 2 : 3);
            let day = dayIdx <= 5 ? dayIdx : (dayIdx <= 12 ? dayIdx - 5 : dayIdx - 12);
            document.getElementById('current-info').innerText = `📍 현재 진행: ${week}주차 ${day}일째 (총 ${dayIdx}일차)`;
            
            let html = "";
            data.u.forEach((user, index) => {
                let name = user[0];
                let records = user[1];
                let score = (records.match(/1/g) || []).length;
                let idStr = String(index + 1).padStart(2, '0');
                
                let circles = "";
                for(let i=0; i<17; i++) {
                    if (records[i] === '1') circles += "🟢";
                    else if (records[i] === '0') circles += "🔴";
                    else circles += "⚪";
                    if (i === 4 || i === 11) circles += " ";
                }
                
                html += `
                    <div class="user-card">
                        <div class="user-header">
                            <span>👤 [${idStr}] ${name}</span>
                            <span>(총 ${score}/17)</span>
                        </div>
                        <div class="circles">${circles}</div>
                    </div>
                `;
            });
            document.getElementById('dashboard').innerHTML = html;
        } else {
            document.getElementById('dashboard').innerHTML = "<p style='text-align:center;'>데이터 오류</p>";
        }
    </script>
</body>
</html>
