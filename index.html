<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일기 누적 현황 대시보드</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f5f7; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .user-card { background: #f9fafc; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #eee; }
        .user-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; color: #222; }
        .progress-bar { background: #e0e0e0; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; margin-bottom: 5px; }
        .progress-fill { background: #4caf50; height: 100%; border-radius: 10px; }
        .stats { font-size: 12px; color: #666; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 중진회개의기간 전체 현황</h2>
        <div id="dashboard">
            <!-- 데이터가 들어갈 자리 -->
        </div>
    </div>

    <script>
        // URL에서 봇이 보낸 데이터를 읽어와서 화면에 예쁘게 그려주는 스크립트
        const urlParams = new URLSearchParams(window.location.search);
        const dataString = urlParams.get('data');
        
        const dashboard = document.getElementById('dashboard');
        
        if (dataString) {
            // 봇이 보낸 데이터를 해석
            const users = JSON.parse(decodeURIComponent(dataString));
            users.forEach(user => {
                const percent = (user.score / 17) * 100;
                dashboard.innerHTML += `
                    <div class="user-card">
                        <div class="user-header"><span>${user.name}</span> <span>${user.score} / 17</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%;"></div></div>
                        <div class="stats">달성률: ${Math.round(percent)}%</div>
                    </div>
                `;
            });
        } else {
            dashboard.innerHTML = "<p style='text-align:center;'>데이터를 불러올 수 없습니다.</p>";
        }
    </script>
</body>
</html>
